<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!--
      viewport-fit=cover lets the page extend into the iPhone notch / home-indicator region
      so env(safe-area-inset-bottom) reports the real hardware inset for the fixed bottom tab bar.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Matching theme-color to --ground in both color schemes keeps the mobile browser chrome
      blended with the app background without a harsh white or black status bar.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e2f3f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1a1a" />
    <title>ENG-LEARN</title>
    <!--
      Load Manrope weights 400/500/600/700 with display=swap so text stays readable immediately
      using the system fallback font while the webfont downloads.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
